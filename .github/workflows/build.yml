name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows-amd64
          - os: windows-11-arm
            target: windows-arm64
          - os: ubuntu-24.04
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-26-intel
            target: macos-amd64
          - os: macos-26
            target: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Show Environment
        shell: bash
        run: |
          echo "===== TOOLCHAIN ====="
          echo CC=$CC
          echo CXX=$CXX

          which go || true
          which gcc || true
          which clang || true

          go version || true
          gcc -v || true
          clang --version || true

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false

      - name: Install Qt
        uses: jdpurcell/install-qt-action@v5
        with:
          version: 6.11.1
          use-naqt: true
          setup-python: false

      # The windows-11-arm runner's default gcc is x86_64.
      # cgo cannot build arm64 shared libraries with that x86_64 gcc,
      # so we use MSYS2 to install an aarch64-w64-mingw32 cross toolchain.

      - name: Setup MSYS2
        if: matrix.os == 'windows-11-arm'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          path-type: inherit
          install: >-
            mingw-w64-cross-mingwarm64-gcc

      - name: Build (Windows ARM)
        if: matrix.os == 'windows-11-arm'
        shell: msys2 {0}
        run: |
          export PATH=/usr/bin:/opt/bin:$PATH
          go env -w CC=aarch64-w64-mingw32-gcc
          go env -w CXX=aarch64-w64-mingw32-g++
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Build (Default)
        if: matrix.os != 'windows-11-arm'
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          cmake --install build --prefix "${{ github.workspace }}/nekobox"
          7z a nekobox-$(git describe --tags --always)-${{ matrix.target }}.zip nekobox

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nekobox-${{ github.sha }}-${{ matrix.target }}
          path: |
            *.zip

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: ./releases

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: ./releases/*
