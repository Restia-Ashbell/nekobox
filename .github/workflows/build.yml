name: Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            target: windows-amd64
          - os: windows-11-vs2026-arm
            target: windows-arm64
          - os: ubuntu-26.04
            target: linux-amd64
          - os: ubuntu-26.04-arm
            target: linux-arm64
          - os: macos-26-intel
            target: macos-amd64
          - os: macos-26
            target: macos-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Install Qt
        uses: jdpurcell/install-qt-action@v5
        with:
          version: 6.12.0
          use-naqt: true
          setup-python: false
          cache: true

      - name: Setup MSYS2
        if: matrix.target == 'windows-arm64'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-cross-mingwarm64-gcc

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "windows-arm64" ]; then
            msys2="$(cygpath -u "${{ steps.msys2.outputs.msys2-location }}")"
            export PATH="$msys2/opt/bin:$msys2/usr/bin:$PATH"
            go env -w CC=aarch64-w64-mingw32-gcc CXX=aarch64-w64-mingw32-g++
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          cmake --install build --prefix "${{ github.workspace }}/nekobox"
          7z a nekobox-$(git describe --tags --always)-${{ matrix.target }}.zip nekobox

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: nekobox-${{ github.sha }}-${{ matrix.target }}
          path: |
            *.zip

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: ./releases

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: ./releases/*
